<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">auto-deploy Skill 案例流程图</title>
  <desc id="desc">展示从前置准备、安装 Skill、自然语言输入部署要求，到自动部署、查看结果、访问应用和清理资源的完整流程。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 32px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5b6472; }
      .section { fill: #ffffff; stroke: #d8e0eb; stroke-width: 2; }
      .section-title { font: 700 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #243041; }
      .small { font: 400 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5b6472; }
      .step { fill: #ffffff; stroke: #9fb5d1; stroke-width: 2; }
      .step-primary { fill: #eef6ff; stroke: #4f8bd6; stroke-width: 2.2; }
      .step-success { fill: #eefaf3; stroke: #43a36b; stroke-width: 2.2; }
      .step-danger { fill: #fff3f0; stroke: #e06b56; stroke-width: 2.2; }
      .pill { fill: #e8eef7; }
      .pill-text { font: 700 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #36506f; }
      .arrow { stroke: #6b7f99; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
      .dashed { stroke-dasharray: 7 6; }
      .auto-box { fill: #fbfdff; stroke: #c7d6ea; stroke-width: 1.6; }
      .num { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .num-circle { fill: #316dc2; }
    </style>
    <marker id="arrowHead" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#6b7f99"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="560" rx="0"/>
  <text class="title" x="58" y="58">auto-deploy Skill 一键部署 Web 应用到华为云 ECS</text>
  <text class="subtitle" x="60" y="88">自然语言输入部署要求，Skill 自动完成项目分析、云资源创建、应用发布、健康检查和资源清理。</text>

  <rect class="section" x="42" y="122" width="1316" height="382" rx="18"/>
  <text class="section-title" x="68" y="158">案例流程</text>

  <!-- Step 1 -->
  <rect class="step" x="70" y="205" width="170" height="116" rx="14"/>
  <circle class="num-circle" cx="98" cy="232" r="16"/>
  <text class="num" x="93" y="238">1</text>
  <text class="label" x="122" y="238">前置准备</text>
  <text class="small" x="92" y="269">环境要求</text>
  <text class="small" x="92" y="291">AK/SK 鉴权</text>
  <text class="small" x="92" y="313">应用样例代码</text>

  <!-- Step 2 -->
  <rect class="step-primary" x="285" y="205" width="180" height="116" rx="14"/>
  <circle class="num-circle" cx="313" cy="232" r="16"/>
  <text class="num" x="308" y="238">2</text>
  <text class="label" x="337" y="238">安装 Skill</text>
  <text class="small" x="307" y="269">安装 auto-deploy</text>
  <text class="small" x="307" y="291">确认 scripts/</text>
  <text class="small" x="307" y="313">确认 templates/</text>

  <!-- Step 3 -->
  <rect class="step-primary" x="510" y="205" width="210" height="116" rx="14"/>
  <circle class="num-circle" cx="538" cy="232" r="16"/>
  <text class="num" x="533" y="238">3</text>
  <text class="label" x="562" y="238">自然语言部署</text>
  <text class="small" x="532" y="269">描述应用名、区域</text>
  <text class="small" x="532" y="291">说明 env 配置</text>
  <text class="small" x="532" y="313">要求健康检查</text>

  <!-- Auto execution box -->
  <rect class="auto-box" x="765" y="176" width="300" height="174" rx="16"/>
  <text class="section-title" x="795" y="210">Skill 自动执行</text>
  <rect class="pill" x="794" y="232" width="106" height="26" rx="13"/>
  <text class="pill-text" x="813" y="250">项目分析</text>
  <rect class="pill" x="917" y="232" width="118" height="26" rx="13"/>
  <text class="pill-text" x="936" y="250">部署计划</text>
  <rect class="pill" x="794" y="269" width="241" height="26" rx="13"/>
  <text class="pill-text" x="836" y="287">Terraform 创建/复用资源</text>
  <rect class="pill" x="794" y="306" width="106" height="26" rx="13"/>
  <text class="pill-text" x="813" y="324">代码上传</text>
  <rect class="pill" x="917" y="306" width="118" height="26" rx="13"/>
  <text class="pill-text" x="936" y="324">启动验证</text>

  <!-- Step 4 -->
  <rect class="step-success" x="1110" y="176" width="190" height="116" rx="14"/>
  <circle class="num-circle" cx="1138" cy="203" r="16"/>
  <text class="num" x="1133" y="209">4</text>
  <text class="label" x="1162" y="209">查看结果</text>
  <text class="small" x="1132" y="240">ECS / EIP</text>
  <text class="small" x="1132" y="262">安全组 / 网络</text>
  <text class="small" x="1132" y="284">部署报告</text>

  <!-- Step 5 -->
  <rect class="step-success" x="1110" y="336" width="190" height="96" rx="14"/>
  <circle class="num-circle" cx="1138" cy="363" r="16"/>
  <text class="num" x="1133" y="369">5</text>
  <text class="label" x="1162" y="369">访问应用</text>
  <text class="small" x="1132" y="400">公网 IP + 端口</text>
  <text class="small" x="1132" y="422">健康检查成功</text>

  <!-- Step 6 -->
  <rect class="step-danger" x="510" y="382" width="210" height="96" rx="14"/>
  <circle class="num-circle" cx="538" cy="409" r="16"/>
  <text class="num" x="533" y="415">6</text>
  <text class="label" x="562" y="415">清理资源</text>
  <text class="small" x="532" y="446">destroy.py</text>
  <text class="small" x="532" y="468">Terraform state 为空</text>

  <!-- Arrows -->
  <path class="arrow" d="M240 263 H278"/>
  <path class="arrow" d="M465 263 H503"/>
  <path class="arrow" d="M720 263 H758"/>
  <path class="arrow" d="M1065 263 H1103"/>
  <path class="arrow" d="M1205 292 V329"/>
  <path class="arrow dashed" d="M1110 390 H742"/>

  <text class="small" x="772" y="390">测试完成后及时清理，避免持续计费</text>

  <rect x="70" y="446" width="300" height="34" rx="17" fill="#fff8e8" stroke="#e3bd67"/>
  <text class="small" x="94" y="468">安全提示：不要在文档或截图中暴露 AK/SK、SSH 私钥或 env 值</text>
</svg>
